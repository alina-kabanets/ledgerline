<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledgerline · Design process</title>
<style>
  :root {
    --accent: #3d5afe;
    --accent-10: #f3f5ff;
    --ink: #10110d;
    --ink-2: #45473e;
    --muted: #686a60;
    --faint: #bdbeba;
    --line: #e0e1df;
    --surface: #f9f9f9;
    --orange: #ff870f;
    --orange-10: #fef5e9;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ink);
    overflow: hidden;
    color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: absolute; left: 50%; top: 50%; width: 1440px; height: 810px; background: #fff; overflow: hidden; }
  .slide { position: absolute; inset: 0; padding: 48px 64px 62px; display: none; flex-direction: column; }
  .slide.active { display: flex; }

  .kicker { font-size: 12px; color: var(--muted); letter-spacing: .02em; }
  h2 { font-size: 34px; font-weight: 400; letter-spacing: -.01em; line-height: 1.12; margin: 4px 0 0; }
  .lede { color: var(--ink-2); margin: 8px 0 0; max-width: 900px; }
  .body { flex: 1; min-height: 0; margin-top: 24px; display: flex; flex-direction: column; }
  h3 { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
  li { display: flex; gap: 9px; align-items: flex-start; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; }
  .chip { display: inline-block; border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
  .tag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 3px; background: var(--ink); color: #fff; letter-spacing: .02em; vertical-align: middle; }
  .tag.soft { background: var(--surface); color: var(--muted); }
  .assume { display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: #fff; border-radius: 4px; padding: 4px 10px; font-size: 12px; font-weight: 500; }

  .dot { width: 8px; height: 8px; border-radius: 2px; background: var(--accent); border: 1px solid var(--ink); flex: none; margin-top: 6px; }
  .dot.hyp { background: #fff; border-color: var(--faint); }
  .legend { display: grid; gap: 6px; color: var(--muted); font-size: 12px; }
  .legend span { display: flex; align-items: center; gap: 8px; }
  .legend .dot { margin-top: 0; }

  /* chrome */
  #bar { position: absolute; left: 64px; right: 64px; bottom: 20px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
  #bar .nav { display: flex; align-items: center; gap: 12px; }
  #bar button { appearance: none; border: 1px solid var(--line); background: #fff; border-radius: 4px; width: 26px; height: 22px; cursor: pointer; font: inherit; color: var(--ink); line-height: 1; }
  #bar button:hover { border-color: var(--ink); }
  #bar button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #progress { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--ink); transition: width .15s cubic-bezier(.4,0,.2,1); }

  /* title */
  .title { justify-content: center; }
  .title .ring { position: absolute; right: -120px; top: 50%; width: 620px; height: 620px; margin-top: -310px; border-radius: 50%; background: var(--accent); }
  .title .ring::after { content: ""; position: absolute; inset: 150px; border-radius: 50%; background: #fff; }
  .title h1 { font-size: 76px; font-weight: 400; letter-spacing: -.02em; line-height: 1; margin: 14px 0 18px; max-width: 760px; position: relative; }
  .title p { margin: 0; font-size: 19px; color: var(--ink-2); max-width: 620px; position: relative; }
  .title .by { margin-top: 44px; font-size: 14px; color: var(--muted); }
  .title ol { position: relative; margin: 28px 0 0; padding: 0; list-style: none; display: flex; gap: 8px; flex-wrap: wrap; max-width: 700px; }

  /* generic grids */
  .cols { display: grid; gap: 16px; }
  .cols.c4 { grid-template-columns: repeat(4, 1fr); }
  .cols.c3 { grid-template-columns: repeat(3, 1fr); }
  .cols.c2 { grid-template-columns: repeat(2, 1fr); }
  .card h4 { font-size: 21px; font-weight: 500; margin: 0 0 4px; }
  .card .sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .card li { font-size: 16px; }
  .card ul { gap: 9px; }
  .card li::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--faint); flex: none; margin-top: 8px; }
  .card li.plain::before { display: none; }
  .num { font-size: 12px; color: var(--muted); }
  q { font-style: italic; quotes: "“" "”"; }

  /* domain */
  .flow { display: flex; align-items: center; gap: 10px; margin: 2px 0 18px; flex-wrap: wrap; }
  .state { border: 1px solid var(--ink); border-radius: 999px; padding: 6px 16px; font-size: 15px; }
  .state.end { background: var(--ink); color: #fff; }
  .arrow { color: var(--muted); }
  .shared { margin-top: 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }

  /* audience */
  .plans { margin-top: 16px; display: grid; grid-template-columns: 150px repeat(3, 1fr); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .plans > div { padding: 12px 18px; border-left: 1px solid var(--line); }
  .plans > div:first-child { border-left: 0; background: var(--surface); display: flex; align-items: center; }
  .plans b { font-weight: 500; font-size: 22px; }
  .plans small { display: block; color: var(--muted); font-size: 12px; }

  /* personas overview */
  .pcards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .pcards .card { padding: 16px; display: flex; flex-direction: column; }
  .pcards h4 { font-size: 19px; margin: 10px 0 8px; }
  .pcards p { margin: 0 0 18px; font-size: 14.5px; color: var(--ink-2); }
  .pcards .why { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); }
  .pcards .why li { font-size: 14px; }
  .note { margin-top: 18px; display: flex; gap: 14px; align-items: center; font-size: 13px; color: var(--ink-2); }
  .note + .note { margin-top: 10px; }
  .note .assume { flex: none; min-width: 92px; justify-content: center; }
  .assume.decide { background: var(--ink); color: #fff; }
  .note.big { font-size: 15px; color: var(--ink); }

  /* receipts */
  .rc .card h4 { margin-bottom: 14px; }
  .rc .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .rc .chips .chip { font-size: 14.5px; padding: 5px 11px; color: var(--ink); }
  .cols.rc2 { grid-template-columns: 1fr 1.5fr; }
  .rc dl.two { grid-template-columns: 1fr 1fr; gap: 14px 28px; }

  .tabsq .card li { font-size: 15px; }
  .tabsq .fits { margin-top: 12px; }
  .tabsq .fits > div { padding: 11px 18px; font-size: 14.5px; }
  .tabsq .note { margin-top: 14px; }

  .cols.ideas4 { grid-template-columns: 1.5fr 1fr 1.2fr 1fr; }
  .ideas .card h4 { margin-bottom: 14px; }
  .ideas dl { gap: 13px; }

  /* AI ideas */
  .itable { display: grid; grid-template-columns: 196px 230px 1fr 236px 216px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; font-size: 12.5px; line-height: 1.35; }
  .itable > div { padding: 8px 12px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
  .itable > div:nth-child(5n+1) { border-left: 0; }
  .itable > .hd { border-top: 0; background: var(--surface); font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
  .itable > .name { font-weight: 500; font-size: 13px; }

  /* what I built, metrics */
  .cols.c5 { grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .built .card { padding: 16px; }
  .built .card h4 { font-size: 18px; margin: 8px 0 8px; }
  .built .card p { margin: 0; font-size: 13.5px; color: var(--ink-2); }
  .built .states { margin-top: 22px; display: grid; grid-template-columns: 1.3fr 1fr; gap: 24px; }
  .built .states .flow { margin: 0; }
  .built .state { font-size: 18px; padding: 8px 20px; }
  .metrics .card { padding: 16px 20px; }
  .metrics .card h4 { font-size: 19px; margin: 6px 0 8px; }
  .metrics .card p { margin: 0; font-size: 14.5px; color: var(--ink); }
  .metrics .card p.why { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .metrics .fits > div { font-size: 13px; }

  .edges .card { padding: 14px 16px 12px; }
  .edges .card h4 { font-size: 21px; font-weight: 500; margin: 0 0 12px; padding-bottom: 9px; border-bottom: 1px solid var(--ink); }
  .edges dl { gap: 6px; }
  .edges dt { font-size: 12.5px; font-weight: 500; }
  .edges dd { font-size: 12px; margin-top: 0; }

  /* photos and screenshots */
  .shots { display: grid; gap: 16px; }
  .shots.s3 { grid-template-columns: repeat(3, 1fr); }
  .shot { margin: 0; }
  .shot img { display: block; width: 100%; height: 400px; object-fit: contain; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
  .shot figcaption { margin-top: 8px; font-size: 12.5px; color: var(--muted); }

  .trace { display: grid; grid-template-columns: 84px 112px 1fr 1.35fr; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; font-size: 12.5px; line-height: 1.3; }
  .trace > div { padding: 6px 12px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
  .trace > div:nth-child(4n+1) { border-left: 0; }
  .trace > .hd { border-top: 0; background: var(--surface); font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
  .trace > .grp { font-weight: 500; font-size: 13px; }
  .trace > .grp:empty { border-top-color: transparent; }
  .trace > .stage { color: var(--muted); }

  .rgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .risks .card { padding: 14px 16px; }
  .risks .card h4 { font-size: 16px; margin: 0 0 8px; line-height: 1.2; }
  .risks .card p { margin: 0; font-size: 12.5px; line-height: 1.4; color: var(--ink-2); }

  /* double diamond */
  .diamonds { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; }
  .phase .shape { height: 190px; display: grid; place-items: center; align-content: center; gap: 4px; background: #e9ecf8; }
  .phase.div .shape { clip-path: polygon(0 50%, 100% 0, 100% 100%); }
  .phase.conv .shape { clip-path: polygon(0 0, 100% 50%, 0 100%); }
  .phase .shape span { font-size: 22px; font-weight: 500; }
  .phase .shape small { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .phase.div .shape { padding-left: 30%; }
  .phase.conv .shape { padding-right: 30%; }
  .phase ul { margin-top: 18px; padding: 0 18px; }
  .phase li { font-size: 14px; }
  .phase li::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--faint); flex: none; margin-top: 8px; }
  .ddlabels { margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr; font-size: 12px; color: var(--muted); text-align: center; border-top: 1px solid var(--line); padding-top: 8px; }

  /* finance lead */
  .titles .card h4 { font-size: 22px; margin-bottom: 10px; }
  .titles .card p { margin: 0; font-size: 15px; color: var(--ink-2); }
  .titles .card .co { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .cadence .card li { font-size: 15.5px; }
  .cadence .card li.hit::before { width: 8px; height: 8px; border-radius: 2px; background: var(--accent); border: 1px solid var(--ink); margin-top: 6px; }
  .cadence .card li:not(.hit)::before { width: 8px; height: 8px; border-radius: 2px; background: #fff; border: 1px solid var(--faint); margin-top: 6px; }
  .fits { margin-top: 16px; display: grid; grid-template-columns: 150px 1fr; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .fits > div { padding: 14px 18px; font-size: 15px; }
  .fits > div:first-child { background: var(--surface); display: flex; align-items: center; }
  .src-note { margin-top: 12px; font-size: 12.5px; color: var(--muted); display: flex; gap: 18px; align-items: center; }
  .src-note span { display: inline-flex; align-items: center; gap: 7px; }
  .src-note .dot { margin-top: 0; }

  /* empathy map */
  .em { display: grid; grid-template-columns: 290px 1fr; gap: 40px; flex: 1; min-height: 0; }
  .em .who { display: flex; flex-direction: column; }
  .em .who h2 { font-size: 40px; margin: 6px 0 12px; }
  .em .who p { margin: 0 0 16px; color: var(--ink-2); }
  .em .facts { display: flex; flex-wrap: wrap; gap: 6px; }
  .em .legend { margin-top: auto; }
  .em .maps { display: flex; flex-direction: column; gap: 14px; min-height: 0; font-size: 16px; }
  .quad { position: relative; flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .q { padding: 18px 22px; }
  .q:nth-child(1), .q:nth-child(2) { border-bottom: 1px solid var(--line); }
  .q:nth-child(1), .q:nth-child(3) { border-right: 1px solid var(--line); padding-right: 44px; }
  .q:nth-child(2), .q:nth-child(4) { padding-left: 44px; }
  .q:nth-child(3), .q:nth-child(4) { padding-top: 30px; }
  .says li span:last-child { font-style: italic; }
  .feels ul { display: flex; flex-wrap: wrap; gap: 6px; }
  .feels li { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
  .feels li .dot { display: none; }
  .core { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 84px; height: 84px; border-radius: 50%; background: var(--accent); color: #fff; border: 1px solid var(--ink); display: grid; place-items: center; text-align: center; font-size: 11.5px; font-weight: 500; line-height: 1.15; padding: 10px; }
  .pg { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .pg .card { padding: 16px 22px; }
  .pains { background: var(--orange-10); border-color: #f6dfc2; }
  .pains h3 { color: #a3540a; }
  .pains .dot.hyp { background: var(--orange); border-color: var(--orange); }
  .gains { background: var(--accent-10); border-color: #d6ddff; }
  .gains h3 { color: #1f2f8f; }
  .em li::before { display: none; }

  /* journey */
  .jm { display: grid; grid-template-columns: 112px repeat(var(--n), 1fr); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; font-size: 17px; line-height: 1.35; }
  .jm:not(.dense) > div { padding: 14px 16px; }
  .jm.dense { font-size: 13.5px; }
  .jm > div { padding: 10px 12px; border-left: 1px solid var(--line); border-top: 1px solid var(--line); }
  .jm > .lab { border-left: 0; font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); background: var(--surface); }
  .jm > .r0 { border-top: 0; }
  .jm > .stage { font-weight: 500; font-size: 15px; display: flex; gap: 7px; align-items: baseline; }
  .jm > .stage i { font-style: normal; font-weight: 400; color: var(--muted); font-size: 11px; }
  .jm > .lab.stage { font-size: 10.5px; font-weight: 400; }
  .jm > .think { font-style: italic; color: var(--ink-2); }
  .jm > .mood { grid-column: 2 / -1; padding: 0; position: relative; height: 58px; }
  .mood svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .mood b { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; border: 1px solid var(--ink); background: #fff; }
  .mood b.up { background: var(--accent); }
  .mood b.down { background: var(--orange); border-color: var(--orange); }
  .jm > .should { background: var(--ink); color: #fff; border-left-color: #2c2e27; }
  .jm > .lab.should { color: #a9b8ff; }
  .jm > .lab.should small { display: block; text-transform: none; letter-spacing: 0; color: var(--faint); margin-top: 4px; }
  .jnote { margin-top: 12px; font-size: 12.5px; color: var(--muted); }

  /* competitors, AI, assumptions */
  .comp .card { display: flex; flex-direction: column; }
  .comp dl { margin: 0; display: grid; gap: 10px; }
  .comp dt { font-weight: 500; font-size: 16px; }
  .comp dd { margin: 2px 0 0; font-size: 14px; color: var(--ink-2); }
  .ai { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .ai .card { padding: 12px 14px; }
  .ai h4 { font-size: 14.5px; margin: 0 0 3px; }
  .ai p { margin: 0; font-size: 12.5px; color: var(--ink-2); }
  .ai .src { margin-top: 6px; font-size: 11px; color: var(--muted); }
  .stance { margin-top: 12px; display: flex; gap: 22px; font-size: 13px; color: var(--ink-2); }
  .as { display: grid; grid-template-columns: 44px 1fr 1.15fr 1fr; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .as > div { padding: 16px 18px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
  .as > div:nth-child(4n+1) { border-left: 0; color: var(--muted); }
  .as > .hd { border-top: 0; background: var(--surface); font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding: 10px 18px; }
  .as > .a { background: var(--accent-10); }
  .as { font-size: 18px; }
  .as > div { padding: 22px 22px; }
  .domain .card { padding: 28px 30px; }
  .domain .card li { font-size: 19px; }
  .domain .card .sub { font-size: 17px; }
  .domain .state { font-size: 19px; padding: 8px 20px; }
  .domain .flow { margin: 6px 0 24px; }
  .domain .shared { font-size: 15px; margin-top: 22px; }
  .domain .chip { font-size: 14px; padding: 4px 10px; }

  @media print {
    @page { size: 1440px 810px; margin: 0; }
    body { background: #fff; overflow: visible; }
    #stage { position: static; transform: none !important; height: auto; overflow: visible; }
    .slide { position: relative; display: flex; height: 810px; break-after: page; }
    #bar, #progress { display: none; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="slides"></div>
  <div id="bar">
    <span id="where"></span>
    <span class="nav"><button id="prev" aria-label="Previous slide">←</button><span id="count"></span><button id="next" aria-label="Next slide">→</button></span>
  </div>
  <div id="progress"></div>
</div>

<script>
// ---------- helpers ----------
const el = (tag, cls, ...kids) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  kids.flat(Infinity).forEach((k) => k != null && n.append(k));
  return n;
};
const slides = [];
const slide = (section, cls, ...kids) => {
  const s = el("section", "slide " + (cls || ""), kids);
  s.dataset.section = section;
  slides.push(s);
  return s;
};
const head = (kicker, title, lede) => [
  el("div", "kicker", kicker),
  el("h2", "", title),
  lede ? el("p", "lede", lede) : null,
];
// Items starting with "~" come from public material; the rest are hypotheses.
const marked = (s, quote) => {
  const fact = s.startsWith("~");
  const text = fact ? s.slice(1) : s;
  return el("li", "", el("i", fact ? "dot" : "dot hyp"), el("span", "", quote ? "“" + text + "”" : text));
};
const mlist = (items, quote) => el("ul", "", items.map((s) => marked(s, quote)));
const plist = (items) => el("ul", "", items.map((s) => el("li", "", el("span", "", s))));

// ---------- data ----------
const PERSONAS = [
  {
    id: "finance", name: "Finance lead", tier: "Primary", core: "Finance lead",
    role: "Head of Finance, Finance Director, Controller or Founding Operator on a team of one to three. Owns invoices end to end and reviews everyone else's receipts.",
    facts: ["50–300 documents a month", "In the platform daily", "Xero or NetSuite", "1–2 pay runs a week"],
    why: ["AP product pages across the market are written for finance directors, controllers and AP managers", "Owns the money going out", "Touches both document types and every state"],
    says: ["Has this one been paid already?", "Who approved this?", "I need the receipt for that card charge.", "Can we pay it Friday with the rest?"],
    thinks: ["Is this the same bank account as last time?", "If the AI coded it wrong, I find out at month end, when it is expensive to fix.", "I do not want to pull money out of the fund earlier than I have to."],
    does: ["Batches work into one or two pay runs a week", "Checks supplier, amount and bank details by eye", "Tracks what is outstanding in a spreadsheet or Slack thread", "Chases colleagues for receipts in the last week of the month"],
    feels: ["Responsible", "Interrupted", "Wary of automation they cannot inspect", "Relieved when the list is empty"],
    pains: ["Re-keying data from PDFs", "Switching between inbox, bank portal and Xero", "~Money market withdrawals take 1–2 business days to settle", "~Receipts are filed among paid invoices today", "Fear of paying a duplicate or a fraudster"],
    gains: ["A list that shows only what needs them", "Paying a whole batch in one go", "Books already right when the accountant looks", "~Hours back: 4+ a month; weekly reconciliation from 1 hour to 15 minutes"],
    journeys: [
      { title: "An invoice, from arrival to paid", stages: [
        ["Intake", "Forwards supplier emails, or drags in a batch of PDFs", "“Just take them all.” Impatient", 0, "One bad file blocks the batch. Unclear whether it worked", "Per-file progress. Failures listed with a reason and a retry; the rest carry on"],
        ["Triage", "Scans the list for what needs attention", "“What do I have to look at?”", -1, "Everything looks equally urgent", "Group by what is needed, with a count on each"],

const MOOD_Y = { "1": 14, "0": 29, "-1": 44 };
const journey = (p, j) => {
  const n = j.stages.length;
  const grid = el("div", "jm" + (n >= 7 ? " dense" : ""));
  grid.style.setProperty("--n", n);
  const row = (label, cls, cells, first) => {
    grid.append(el("div", "lab " + cls + (first ? " r0" : ""), label));
    cells.forEach((c) => grid.append(el("div", cls + (first ? " r0" : ""), c)));
  };
  row("Stage", "stage", j.stages.map((s, i) => [el("i", "", String(i + 1)), s[0]]), true);
  row("Does", "", j.stages.map((s) => s[1]));
  row("Thinks, feels", "think", j.stages.map((s) => s[2]));

  grid.append(el("div", "lab", "Mood"));
  const mood = el("div", "mood");
  const pts = j.stages.map((s, i) => [((i + 0.5) / n) * 100, MOOD_Y[s[3]]]);
  mood.innerHTML = '<svg viewBox="0 0 100 58" preserveAspectRatio="none"><polyline fill="none" stroke="#bdbeba" stroke-width="1" vector-effect="non-scaling-stroke" points="' +
    pts.map((q) => q.join(",")).join(" ") + '"/></svg>';
  pts.forEach(([x, y], i) => {
    const d = el("b", j.stages[i][3] > 0 ? "up" : j.stages[i][3] < 0 ? "down" : "");
    d.style.left = x + "%";
    d.style.top = y + "px";
    mood.append(d);
  });
  grid.append(mood);

  row("Friction", "", j.stages.map((s) => s[4]));
  grid.append(el("div", "lab should", "What the page should do", el("small", "", "My conclusion")));
  j.stages.forEach((s) => grid.append(el("div", "should", s[5])));

  return slide("Journey · " + p.name, "",
    head("Define · User journey · " + p.name, j.title),
    el("div", "body", grid, el("div", "jnote", (j.note ? j.note + " " : "") + "Stages, thoughts and friction are hypotheses."))
  );
};

// ---------- mount and navigate ----------
const root = document.getElementById("slides");
slides.forEach((s) => root.append(s));
const stage = document.getElementById("stage");
const fit = () => {
  const k = Math.min(innerWidth / 1440, innerHeight / 810);
  stage.style.transform = "translate(-50%, -50%) scale(" + k + ")";
};
let at = 0;
const go = (i) => {
  at = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((s, n) => s.classList.toggle("active", n === at));
  document.getElementById("count").textContent = String(at + 1).padStart(2, "0") + " / " + slides.length;
  document.getElementById("where").textContent = at === 0 ? "" : "Design process · " + slides[at].dataset.section;
  document.getElementById("progress").style.width = ((at + 1) / slides.length) * 100 + "%";
  if (location.hash !== "#" + (at + 1)) history.replaceState(null, "", "#" + (at + 1));
};
document.getElementById("prev").onclick = () => go(at - 1);
document.getElementById("next").onclick = () => go(at + 1);
addEventListener("keydown", (e) => {
  if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(at + 1); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(at - 1); }
  else if (e.key === "Home") go(0);
  else if (e.key === "End") go(slides.length - 1);
});
addEventListener("resize", fit);
addEventListener("hashchange", () => go((parseInt(location.hash.slice(1), 10) || 1) - 1));
fit();
go((parseInt(location.hash.slice(1), 10) || 1) - 1);
